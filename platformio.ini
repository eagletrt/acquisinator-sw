[platformio]
src_dir = Core/Src
include_dir = Core/Inc
test_dir = Core/Test

[env:native]
platform = native
test_framework = unity
lib_deps = throwtheswitch/Unity@^2.6.0
test_build_src = true
build_src_filter = 
    +<acquisinator_fsm.c>

[env:stm32f334k8u6]
platform = ststm32
upload_protocol = stlink
monitor_speed = 115200

board = disco_f334c8
board_build.ldscript = STM32F334XX_FLASH.ld

build_flags = 
    -DUSE_HAL_DRIVER
    -DSTM32F334x8
    -IDrivers/STM32F3xx_HAL_Driver/Inc 
    -IDrivers/STM32F3xx_HAL_Driver/Inc/Legacy 
    -IDrivers/CMSIS/Device/ST/STM32F3xx/Include 
    -IDrivers/CMSIS/Include
    -Wall 
    -Wextra 
    -Wpedantic 
    ;-Werror
build_src_filter = 

