[platformio]
src_dir = Core/Src
include_dir = Core/Inc

[common]
platform = ststm32
upload_protocol = stlink
monitor_speed = 115200

board = disco_f334c8
board_build.ldscript = STM32F334XX_FLASH.ld

build_flags = 
    -DUSE_HAL_DRIVER
    -DUSE_FULL_LL_DRIVER
    -DSTM32F334x8
    -IDrivers/STM32F3xx_HAL_Driver/Inc 
    -IDrivers/STM32F3xx_HAL_Driver/Inc/Legacy 
    -IDrivers/CMSIS/Device/ST/STM32F3xx/Include 
    -IDrivers/CMSIS/Include
    -Wall 
    -Wextra 
    -Wpedantic 
    ;-Werror
build_src_filter = 

[env:acquisinator-bootloader-1]
platform = ${common.platform}
upload_protocol = ${common.upload_protocol}
monitor_speed = ${common.monitor_speed}

board = ${common.board}
board_build.ldscript = ${common.board_build.ldscript}

build_flags = 
    ${common.build_flags}
    -DACQUISINATOR_ID=1
    
build_src_filter =

[env:acquisinator-bootloader-2]
platform = ${common.platform}
upload_protocol = ${common.upload_protocol}
monitor_speed = ${common.monitor_speed}

board = ${common.board}
board_build.ldscript = ${common.board_build.ldscript}

build_flags = 
    ${common.build_flags}
    -DACQUISINATOR_ID=2
    
build_src_filter =


[env:acquisinator-bootloader-3]
platform = ${common.platform}
upload_protocol = ${common.upload_protocol}
monitor_speed = ${common.monitor_speed}

board = ${common.board}
board_build.ldscript = ${common.board_build.ldscript}

build_flags = 
    ${common.build_flags}
    -DACQUISINATOR_ID=3
    
build_src_filter =


[env:acquisinator-bootloader-4]
platform = ${common.platform}
upload_protocol = ${common.upload_protocol}
monitor_speed = ${common.monitor_speed}

board = ${common.board}
board_build.ldscript = ${common.board_build.ldscript}

build_flags = 
    ${common.build_flags}
    -DACQUISINATOR_ID=4
    
build_src_filter =

